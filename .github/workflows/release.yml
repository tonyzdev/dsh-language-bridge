name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      - run: npm pack
      - name: Attach tarball to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && gh release upload "$GITHUB_REF_NAME" ./*.tgz --clobber || gh release create "$GITHUB_REF_NAME" ./*.tgz --generate-notes
      # Needs npm Trusted Publishing set up for this repo on npmjs.com; skipped until then.
      - name: Publish to npm
        run: npm publish --provenance --access public || echo "::warning::npm publish skipped or failed (Trusted Publishing not configured yet?)"
