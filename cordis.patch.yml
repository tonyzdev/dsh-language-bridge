- insert:
    # DeepSeek Flash translation service shipped with dsh (experimental, opt-in).
    - id: claude-zh-bridge-translator
      name: '@deepseek-ai/dsh-experimental-translator'
    - id: claude-zh-bridge
      name: '@local/claude-zh-bridge'
      config:
        # auto picks deepseek-official (API key), then deepseek-account; or name one explicitly.
        provider: auto
        # Case-insensitive regular expression tested against the model id.
        # Both the Claude and the Gemini families get the English-input / Chinese-reply bridge.
        modelPattern: 'claude|gemini'
        translateInput: true
        translateOutput: true
